<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28" fill="none">
  <!-- Light Mode Designer Typographer's Pin: High-contrast white halo + Ink black + Vermilion focal bead -->
  <defs>
    <filter id="inkPinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#161614" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Bold Pure White Halo: Ensures 100% crystal clarity on white inputs -->
  <path d="M6 5H18M6 23H18M12 5V23" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Elegant Matte Obsidian Spine -->
  <path d="M6 5H18M6 23H18M12 5V23" stroke="#161614" stroke-width="2.2" stroke-linecap="round" filter="url(#inkPinShadow)" />
  <!-- Terracotta Vermilion Center Focal Point: Instantly locates the typing cursor! -->
  <circle cx="12" cy="14" r="2.5" fill="#d94e28" stroke="#ffffff" stroke-width="1" />
</svg>
